<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PER TE ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: 'Press Start 2P', cursive;
  background: #0b0000;
  color: white;
  overflow: hidden;
}

/* scanlines */
body::before {
  content: "";
  position: fixed;
  width: 100%;
  height: 100%;
  background: repeating-linear-gradient(
    to bottom,
    rgba(255,255,255,0.03),
    rgba(255,255,255,0.03) 1px,
    transparent 2px,
    transparent 4px
  );
  pointer-events: none;
}

/* grid retro */
body::after {
  content: "";
  position: fixed;
  width: 100%;
  height: 100%;
  background:
    linear-gradient(rgba(255,0,0,0.08) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,0,0,0.08) 1px, transparent 1px);
  background-size: 40px 40px;
  opacity: 0.4;
  pointer-events: none;
}

.screen {
  display: none;
  height: 100vh;
  width: 100vw;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  text-align: center;
}

.active { display: flex; }

h1 {
  font-size: 14px;
  color: white;
  text-shadow: 0 0 10px red;
  padding: 20px;
}

p {
  font-size: 10px;
  color: #ffb3c6;
  margin-top: 10px;
  padding: 0 20px;
}

button {
  font-family: 'Press Start 2P', cursive;
  background: black;
  border: 2px solid red;
  color: white;
  padding: 12px;
  margin-top: 20px;
}

button:hover {
  background: red;
  color: black;
}

/* GIF */
img {
  width: 120px;
  margin: 10px;
  image-rendering: pixelated;
}

/* ICONS */
.icon {
  width: 90px;
  margin: 10px;
  cursor: pointer;
}

/* POPUP */
.popup {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%,-50%);
  background: black;
  border: 2px solid red;
  padding: 20px;
  display: none;
  text-align: center;
  z-index: 10;
}

.popup img {
  max-width: 220px;
  border: 2px solid white;
}
</style>
</head>

<body>

<!-- SCHERMATA 1 -->
<div class="screen active" id="s1">
  <img src="https://media.giphy.com/media/3ohzdIuqJoo8QdKlnW/giphy.gif">
  <h1>VUOI APRIRE IL REGALO?</h1>
  <button onclick="next(2)">SI</button>
</div>

<!-- SCHERMATA 2 -->
<div class="screen" id="s2">
  <img src="https://media.giphy.com/media/l0MYt5jPR6QX5pnqM/giphy.gif">
  <h1>TI PROMETTO CHE TI PIACERÀ ❤️</h1>
  <button onclick="next(3)">VEDIAMO IL REGALO</button>
</div>

<!-- SCHERMATA 3 -->
<div class="screen" id="s3">

  <h1>QUESTI SONO PER TE!</h1>

  <!-- CANZONE -->
  <div onclick="music()">
    <img class="icon" src="https://media.giphy.com/media/13borq7Zo2kulO/giphy.gif">
    <p>Una canzone che mi ricorda te 🎵</p>
  </div>

  <!-- FOTO -->
  <div onclick="photo()">
    <img class="icon" src="https://media.giphy.com/media/26AHONQ79FdWZhAI0/giphy.gif">
    <p>La mia immagine preferita di noi due 📸</p>
  </div>

  <!-- REGALO -->
  <div onclick="gift()">
    <img class="icon" src="https://media.giphy.com/media/3oEjI6SIIHBdRxXI40/giphy.gif">
    <p>Il tuo regalo 🎁</p>
  </div>

</div>

<!-- POPUP -->
<div class="popup" id="popup">
  <div id="content"></div>
  <button onclick="closeP()">CHIUDI</button>
</div>

<script>
function next(n){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('s'+n).classList.add('active');
}

function photo(){
  document.getElementById("content").innerHTML =
    "<div>RICORDO SBLLOCCATO</div><img src='foto_coppia.JPG'>";
  document.getElementById("popup").style.display = "block";
}

function gift(){
  document.getElementById("content").innerHTML =
    "<div>REGALO PER TE</div><img src='IMG_3842.jpeg'>";
  document.getElementById("popup").style.display = "block";
}

function music(){
  window.open("https://www.youtube.com/watch?v=tTX6sJeZcmI&list=RDtTX6sJeZcmI&start_radio=1", "_blank");
}

function closeP(){
  document.getElementById("popup").style.display = "none";
}
</script>

</body>
</html>
